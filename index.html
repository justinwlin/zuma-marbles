<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#07111d" />
    <meta name="description" content="A Zuma-style marble shooter. Infinite generated levels, plays offline on phone and desktop." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Zuma Marbles" />
    <link rel="icon" href="./icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <title>Zuma Marbles</title>
  </head>
  <body>
    <div id="stage">
      <canvas id="game" aria-label="Game board"></canvas>
      <!-- iOS only: an invisible switch under the finger. Safari gives a haptic tick when a real
           tap toggles a switch (scripted toggles are ignored since iOS 26). -->
      <label id="tapzone" class="tapzone hidden" aria-hidden="true"><input type="checkbox" switch tabindex="-1" /></label>
    </div>

    <div id="hud" class="hidden">
      <div class="hud-top">
        <button id="btn-pause" class="icon-btn" aria-label="Pause">
          <svg viewBox="0 0 24 24" width="22" height="22"><rect x="6" y="5" width="4" height="14" rx="1.5" fill="currentColor"/><rect x="14" y="5" width="4" height="14" rx="1.5" fill="currentColor"/></svg>
        </button>
        <button id="btn-help" class="icon-btn" aria-label="Power-ups and tips">?</button>
        <div class="lvl"><b id="hud-level">Level 1</b><small id="hud-name"></small></div>
        <div class="bar" aria-label="Level progress">
          <div class="bar-fill" id="hud-bar"></div>
          <span class="bar-label" id="hud-bar-label">ZUMA</span>
        </div>
        <div class="score"><b id="hud-score">0</b><small id="hud-streak"></small></div>
      </div>
      <div class="hud-bottom">
        <div class="powers" id="hud-powers"></div>
        <label id="btn-swap" class="swap-btn" role="button" aria-label="Swap marbles">
          <span class="dot big" id="swap-cur"></span><span class="dot" id="swap-next"></span>
          <svg viewBox="0 0 24 24" width="18" height="18"><path d="M7 7h11l-3-3M17 17H6l3 3" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <input type="checkbox" switch tabindex="-1" aria-hidden="true" class="haptic-switch" />
        </label>
      </div>
    </div>

    <div id="cancel-zone" class="cancel-zone" aria-hidden="true">✕ Cancel</div>
    <div id="screens"></div>
    <div id="toast" class="toast"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
